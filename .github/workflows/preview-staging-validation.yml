name: Zero-Cost Staging & Preview Validation

on:
  pull_request:
    branches:
      - visaapply-staging
      - main
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Optional live Vercel Hobby Preview URL (https://*.vercel.app) for live E2E, SEO, a11y & CLS checks'
        required: false
        type: string
        default: ''

# Strict least-privilege read-only permissions (zero secrets, zero write access, 100% free GitHub Actions tier)
permissions:
  contents: read

# Cancel superseded runs immediately to conserve GitHub Actions Free minutes
concurrency:
  group: visaapply-preview-staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-cost-staging-checks:
    name: Zero-Cost Staging Validation (TS, Build, Regression, Catalog, Editorial & SEO)
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'visaapply-staging' || github.head_ref == 'visaapply-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (lockfile-safe)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript check (tsc --noEmit)
        run: npm run lint

      - name: Static catalog validation (17 checks)
        run: npm run catalog:validate

      - name: GitHub governance & workflow config check
        run: npm run editorial:verify-github-config

      - name: Editorial governance & PR validation
        run: npm run editorial:validate-pr

      - name: Preview SEO, zero-cost staging & workflow unit tests
        run: node --test --import tsx tests/phase9_2_vercel_preview_workflow.test.ts tests/phase9_3_zero_cost_preview_validation.test.ts

      - name: Production frontend bundle build
        run: npm run build

  optional-live-preview-e2e:
    name: Optional Live Vercel Preview E2E, Accessibility & CLS Check
    if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (lockfile-safe)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Playwright Chromium (free headless browser)
        run: npx playwright install chromium

      - name: Verify live Preview X-Robots-Tag noindex header
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          if [[ ! "$PREVIEW_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "Invalid preview_url format; must be https://<hostname> without path/query."
            exit 1
          fi
          HEADERS="$(curl -fsSI "${PREVIEW_URL}/")"
          echo "$HEADERS" | grep -iE '^x-robots-tag:.*noindex'

      - name: Run Playwright Preview & Phase 9.3 Zero-Cost E2E Suites
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          npm run test:e2e:preview
          npm run test:e2e:preview:phase93
