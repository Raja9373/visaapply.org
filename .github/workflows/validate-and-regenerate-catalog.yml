name: Validate Canonical Catalog & Verify Atomic Regeneration

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'src/schemas/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'src/schemas/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visaapply-validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-verify-regeneration:
    name: Validate Catalog, Run Pipeline Tests & Dry-Run Atomic Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript static type-check
        run: npm run lint

      - name: Run 17-check canonical static catalog validator
        run: npm run catalog:validate

      - name: Verify atomic catalog & candidate sitemap regeneration (dry-run)
        run: npm run catalog:regenerate-safe -- --dry-run

      - name: Run full automated regression & Phase 5B pipeline test suite
        run: node --test --import tsx tests/*.test.ts

      - name: Verify production frontend bundle compiles cleanly
        run: npm run build

      - name: Generate Data Quality Dashboard summary artifact
        run: npm run catalog:quality-report

      - name: Upload Data Quality Dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation-quality-report-${{ github.run_id }}
          retention-days: 14
          path: data/monitoring/data-quality-report.json
